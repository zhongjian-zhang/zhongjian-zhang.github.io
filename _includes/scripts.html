<script src="assets/js/main.min.js"></script>

{% include analytics.html %}
{% include fetch_google_scholar_stats.html %}

<!-- Busuanzi Visitor Counter -->
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script src="/assets/js/visit-count.js"></script>

<!-- Back to Top Button -->
<button class="back-to-top" id="backToTop" title="Back to Top">
    <i class="fas fa-chevron-up"></i>
</button>

<!-- Dark Mode Toggle -->
<button class="dark-mode-toggle" id="darkModeToggle" title="Toggle Dark Mode">
    <i class="fas fa-moon" id="darkModeIcon"></i>
</button>

<div id="wechat-qr-modal" class="wechat-qr-modal" aria-hidden="true">
    <button type="button" class="wechat-qr-modal__backdrop" aria-label="Close Wechat QR code"></button>
    <div class="wechat-qr-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="wechat-qr-title">
        <button type="button" class="wechat-qr-modal__close" aria-label="Close Wechat QR code">&times;</button>
        <h3 id="wechat-qr-title">Wechat</h3>
        <img src="/images/wechat-qr.png" alt="Wechat QR code for Zhongjian Zhang">
    </div>
</div>

<script>
// Back to Top
const backToTop = document.getElementById('backToTop');
window.addEventListener('scroll', () => {
    if (window.scrollY > 300) {
        backToTop.classList.add('show');
    } else {
        backToTop.classList.remove('show');
    }
});
backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Dark Mode
const darkModeToggle = document.getElementById('darkModeToggle');
const darkModeIcon = document.getElementById('darkModeIcon');
const currentTheme = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-theme', currentTheme);
if (currentTheme === 'dark') {
    darkModeIcon.classList.replace('fa-moon', 'fa-sun');
}

darkModeToggle.addEventListener('click', () => {
    const theme = document.documentElement.getAttribute('data-theme');
    if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        darkModeIcon.classList.replace('fa-sun', 'fa-moon');
    } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        darkModeIcon.classList.replace('fa-moon', 'fa-sun');
    }
});

// BibTeX Copy Function
function copyBibtex(button) {
    const bibtexId = button.getAttribute('data-bibtex');
    const bibtexContent = document.getElementById(bibtexId).innerText;
    navigator.clipboard.writeText(bibtexContent).then(() => {
        const originalText = button.innerHTML;
        button.innerHTML = '<i class="fas fa-check"></i> Copied!';
        button.classList.add('copied');
        setTimeout(() => {
            button.innerHTML = originalText;
            button.classList.remove('copied');
        }, 2000);
    });
}

// Wechat QR Modal
document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('wechat-qr-modal');
    if (!modal) return;

    const openModal = (event) => {
        event.preventDefault();
        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
    };

    const closeModal = () => {
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
    };

    document.querySelectorAll('.wechat-qr-trigger').forEach((trigger) => {
        trigger.addEventListener('click', openModal);
    });

    modal.querySelectorAll('.wechat-qr-modal__backdrop, .wechat-qr-modal__close').forEach((control) => {
        control.addEventListener('click', closeModal);
    });

    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && modal.classList.contains('is-open')) {
            closeModal();
        }
    });
});
</script>
