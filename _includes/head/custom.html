  .wechat-qr-modal {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .wechat-qr-modal.is-open {
    display: flex;
  }

  .wechat-qr-modal.is-open .wechat-qr-modal__backdrop {
    animation: wechat-modal-fade 0.18s ease-out both;
  }

  .wechat-qr-modal.is-open .wechat-qr-modal__dialog {
    animation: wechat-modal-pop 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .wechat-qr-modal__backdrop {
    position: absolute;
    inset: 0;
    padding: 0;
    border: 0;
    background: rgba(15, 23, 42, 0.55);
    cursor: pointer;
  }

  .wechat-qr-modal__dialog {
    position: relative;
    z-index: 1;
    width: min(88vw, 24rem);
    padding: 1.15rem 1.15rem 1.25rem;
    border: 1px solid rgba(226, 232, 240, 0.95);
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 24px 70px rgba(15, 23, 42, 0.35);
    text-align: center;
  }

  .wechat-qr-modal__dialog h3 {
    margin: 0 2rem 1rem;
    color: #2f3437;
    font-size: 1.25rem;
    line-height: 1.25;
  }

  .wechat-qr-modal__dialog img {
    display: block;
    width: 100%;
    max-height: 72vh;
    object-fit: contain;
    border-radius: 14px;
    background: #fff;
  }

  .wechat-qr-modal__close {
    position: absolute;
    top: 0.72rem;
    right: 0.82rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.85rem;
    height: 1.85rem;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #6b7280;
    font-size: 1.55rem;
    line-height: 1;
    cursor: pointer;
    text-decoration: none;
  }

  .wechat-qr-modal__close:hover {
    background: #f3f4f6;
    color: #111827;
    text-decoration: none;
  }

  [data-theme="dark"] .wechat-qr-modal__dialog {
    background: #18223a;
  }

  [data-theme="dark"] .wechat-qr-modal__dialog h3 {
    color: #e5e7eb;
  }

  @keyframes wechat-modal-fade {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  @keyframes wechat-modal-pop {
    from {
      opacity: 0;
      transform: translateY(14px) scale(0.96);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .wechat-qr-modal.is-open .wechat-qr-modal__backdrop,
    .wechat-qr-modal.is-open .wechat-qr-modal__dialog {
      animation: none;
    }
  }
