<script src="/assets/js/scholar-stats.js"></script>
<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}
        var statusEl = document.getElementById('citation-update-status');
        function showUnavailable() {
            if (statusEl) statusEl.textContent = 'Citation data unavailable';
        }
        $.ajax({
            url: gsDataBaseUrl + "google-scholar-stats/gs_data.json",
            dataType: 'json', cache: false, timeout: 10000
        }).done(function (data) {
            var status = ScholarStats.citationStatus(data);
            if (!status) {
                showUnavailable();
                return;
            }
            if (statusEl) {
                statusEl.textContent = status.text;
                statusEl.classList.toggle('is-stale', status.stale);
            }
            var totalCitation = status.count;
            var totalCitationEl = document.getElementById('total_cit');
            if (totalCitationEl) {
                totalCitationEl.textContent = totalCitation;
            }
            var scholarCount = document.querySelector('.scholar-stats__count');
            if (scholarCount) {
                scholarCount.textContent = totalCitation;
            }
            var scholarBadge = document.querySelector('.scholar-stats__badge');
            if (scholarBadge && scholarBadge.dataset.badgePrefix && scholarBadge.dataset.badgeSuffix) {
                scholarBadge.src = scholarBadge.dataset.badgePrefix + encodeURIComponent(totalCitation) + scholarBadge.dataset.badgeSuffix;
            }
            var citationEles = document.getElementsByClassName('show_paper_citations')
            Array.prototype.forEach.call(citationEles, element => {
                var paperId = element.getAttribute('data')
                if (data['publications'] && data['publications'][paperId]) {
                    var numCitations = data['publications'][paperId]['num_citations']
                    element.innerHTML = '| Citations: ' + numCitations;
                }
            });
        }).fail(showUnavailable);
    })
</script>
