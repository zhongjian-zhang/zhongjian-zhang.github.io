name: Get Citation Data

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install crawler dependencies
        working-directory: google_scholar_crawler
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test crawler
        working-directory: google_scholar_crawler
        run: python -m unittest -v

      - name: Fetch Scholar citations
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SCHOLAR_SOURCE: serpapi
        run: python -u main.py

      - name: Validate citation JSON
        working-directory: google_scholar_crawler
        run: |
          python -m json.tool results/gs_data.json > /dev/null
          python -m json.tool results/gs_data_shieldsio.json > /dev/null

      - name: Check out published citation data
        uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: citation-data

      - name: Publish citation data
        working-directory: citation-data
        run: |
          cp ../google_scholar_crawler/results/gs_data*.json .
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Updated Citation Data"
          git push origin HEAD:google-scholar-stats
